name: One-time duplicate v1.0.0 release cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "github.event.head_commit.message == 'chore(releases): clean duplicated v1.0.0 downloads'"
    runs-on: ubuntu-latest
    steps:
      - name: Prune only verified legacy release duplicates
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const publishedId = 437684398;
            const draftId = 437684400;
            const wantedInstaller = { id: 721201166, name: 'Companio-Setup-1.0.0.exe' };
            const toDelete = new Map([
              [721207281, 'Companio-1.0.0.exe'],
              [721201210, 'Companio-Setup-1.0.0.exe.blockmap'],
              [721208905, 'Companio.1.0.0.exe'],
              [721208917, 'Companio.Setup.1.0.0.exe'],
              [721207604, 'latest.yml']
            ]);
            const published = (await github.rest.repos.getRelease({
              owner, repo, release_id: publishedId
            })).data;
            const draft = (await github.rest.repos.getRelease({
              owner, repo, release_id: draftId
            })).data;
            if (published.tag_name !== 'v1.0.0' || published.draft ||
                draft.tag_name !== 'v1.0.0' || !draft.draft) {
              throw new Error('Release IDs or draft state changed; refusing destructive cleanup.');
            }
            const listAssets = id => github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: id, per_page: 100
            });
            const assets = await listAssets(publishedId);
            const keeper = assets.filter(a => a.id === wantedInstaller.id && a.name === wantedInstaller.name);
            if (keeper.length !== 1) {
              throw new Error('Original setup installer changed; refusing destructive cleanup.');
            }
            for (const asset of assets) {
              if (asset.id === wantedInstaller.id) continue;
              if (toDelete.get(asset.id) !== asset.name) {
                throw new Error('Unexpected asset ' + asset.id + ' (' + asset.name + '); refusing cleanup.');
              }
            }
            const draftAssets = await listAssets(draftId);
            const expectedDraft = new Map([
              [721207008, 'Companio-1.0.0.exe'],
              [721201137, 'Companio-Setup-1.0.0.exe'],
              [721207296, 'latest.yml']
            ]);
            for (const asset of draftAssets) {
              if (expectedDraft.get(asset.id) !== asset.name) {
                throw new Error('Unexpected draft asset; refusing cleanup: ' + asset.name);
              }
            }
            for (const asset of assets) {
              if (!toDelete.has(asset.id)) continue;
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              core.info('Removed redundant asset: ' + asset.name);
            }
            await github.rest.repos.deleteRelease({ owner, repo, release_id: draftId });
            core.info('Removed duplicate unpublished v1.0.0 draft release');
            const remaining = await listAssets(publishedId);
            if (remaining.length !== 1 || remaining[0].id !== wantedInstaller.id) {
              throw new Error('Cleanup verification failed: unexpected remaining published assets.');
            }
            await core.summary
              .addHeading('Companio v1.0.0 release cleanup')
              .addRaw('Kept one installer, removed five redundant uploaded assets and the duplicate draft. GitHub source archives remain available automatically.')
              .write();
