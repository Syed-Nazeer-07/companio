name: Validate Electron 45 Upgrade

on:
  push:
    branches:
      - upgrade/electron-45-2026-11-07

permissions:
  contents: write

concurrency:
  group: electron-45-upgrade-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Windows build, security audit, and x64 + ARM64 package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for Electron 45.2.3
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install new locked dependencies
        run: npm ci
      - name: Assert upgraded Electron version
        run: node -e "if(require('electron/package.json').version !== '45.2.3')process.exit(1)"
      - name: Native security regression tests
        run: npm run test:unit
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Require zero high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Build Windows x64 and ARM64 portable app directories
        run: npx electron-builder --win --x64 --arm64 --dir --publish never
      - name: Commit verified lockfile to candidate branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore(deps): lock verified Electron 45.2.3 dependencies"
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit validated dependency lockfile" }
            git push origin HEAD:refs/heads/upgrade/electron-45-2026-11-07
            if ($LASTEXITCODE -ne 0) { throw "Failed to push validated dependency lockfile" }
          }
