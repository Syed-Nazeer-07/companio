name: Companio Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce no high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate IPC and shortcut tests
        run: npm run test:unit
      - name: Typecheck and production bundle
        run: npm run build
      - name: Smoke test actual Electron UI and IPC
        run: npm run test:desktop-smoke

  package-preview:
    name: Build unsigned Windows ${{ matrix.arch }} preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Package preview installer and portable application
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content "release/SHA256SUMS-${{ matrix.arch }}.txt"
      - name: Upload unsigned Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: companio-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14
