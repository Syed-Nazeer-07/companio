name: Companio Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce no high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate IPC and shortcut tests
        run: npm run test:unit
      - name: Typecheck and production bundle
        run: npm run build
      - name: Package the actual Windows x64 app for smoke testing
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Smoke test packaged Electron UI and IPC
        run: npm run test:desktop-smoke

  package-preview:
    name: Build unsigned Windows ${{ matrix.arch }} preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Package installer only
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Show installer SHA-256 in the workflow summary
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter 'Companio-Setup-*.exe' | Select-Object -First 1
          if (-not $file) { throw "Installer not found" }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Companio ${{ matrix.arch }} installer: $($file.Name)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "SHA-256: $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload clean installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Companio-${{ matrix.arch }}
          path: release/Companio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
