name: Companio Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every feature commit validates the app. Cancel only obsolete runs on the
# same branch, keeping the newest check and installer artifacts authoritative.
concurrency:
  group: companio-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore Electron Builder download cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.electron-builder-cache
          key: companio-electron-builder-${{ runner.os }}-v26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            companio-electron-builder-${{ runner.os }}-v26-
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce no high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Validate IPC and shortcut tests
        run: npm run test:unit
      - name: Typecheck and production bundle
        run: npm run build
      - name: Regenerate multi-resolution Windows icons
        shell: pwsh
        run: ./scripts/generate-icon.ps1
      - name: Package the actual Windows x64 app for smoke testing
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --x64 --dir --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Warning "Electron download/package failed (attempt $attempt). Retrying."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          exit 1
      - name: Smoke test packaged Electron UI and IPC
        run: npm run test:desktop-smoke

  # Cross-compiling an ARM64 installer on x64 does not show whether its
  # Electron app actually starts on Windows ARM. Exercise the real ARM binary.
  arm64-native-smoke:
    name: Verify packaged Electron on native Windows ARM64
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    needs: verify
    runs-on: windows-11-arm
    timeout-minutes: 35
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node ARM64
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check real native ARM64 runner
        shell: pwsh
        run: |
          $arch = node -p "process.arch"
          if ($arch -ne 'arm64') { throw "Expected ARM64 Node, found $arch" }
          "Testing Electron on actual ARM64 Windows" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Regenerate Windows icons
        shell: pwsh
        run: ./scripts/generate-icon.ps1
      - name: Prepare verified ARM64 offline voice runtime
        shell: pwsh
        run: node scripts/prepare-bundled-voice.cjs arm64
      - name: Package native ARM64 app for smoke test
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --arm64 --dir --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          exit 1
      - name: Smoke test native ARM64 Electron UI and IPC
        run: npm run test:desktop-smoke
      - name: Build native ARM64 installer for real install check
        shell: pwsh
        run: npx electron-builder --win nsis --arm64 --publish never
      - name: Test native ARM64 silent installation and measure setup overhead
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Companio-Setup-*-arm64.exe' | Select-Object -First 1
          if (-not $installer) { throw "ARM64 installer not found" }
          ./scripts/test-installer.ps1 -Architecture arm64 -InstallerPath $installer.FullName

  package-preview:
    name: Build unsigned Windows ${{ matrix.arch }} preview
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore Electron Builder download cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.electron-builder-cache
          key: companio-electron-builder-${{ runner.os }}-v26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            companio-electron-builder-${{ runner.os }}-v26-
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Regenerate multi-resolution Windows icons
        shell: pwsh
        run: ./scripts/generate-icon.ps1
      - name: Include verified offline voice engine and model
        shell: pwsh
        run: node scripts/prepare-bundled-voice.cjs ${{ matrix.arch }}
      - name: Package installer only
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Warning "Installer packaging failed (attempt $attempt). Retrying."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          exit 1
      - name: Validate x64 silent installation and measure setup overhead
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Companio-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw "x64 installer not found" }
          ./scripts/test-installer.ps1 -Architecture x64 -InstallerPath $installer.FullName
      - name: Show installer SHA-256 in the workflow summary
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter 'Companio-Setup-*.exe' | Select-Object -First 1
          if (-not $file) { throw "Installer not found" }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Companio ${{ matrix.arch }} installer: $($file.Name)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "SHA-256: $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload clean installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Companio-${{ matrix.arch }}
          path: release/Companio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  # A successful release commit must pass the real native ARM64 smoke test
  # *and* build both installers before creating a public preview. Only the two
  # executable installers become release assets: no portable duplicates,
  # blockmaps, update metadata or separate checksum downloads.
  publish-preview:
    name: Publish two verified Windows preview installers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    needs: [verify, arm64-native-smoke, package-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v5
      - name: Download both verified installers
        uses: actions/download-artifact@v5
        with:
          pattern: Companio-*
          path: release-artifacts
      - name: Verify exactly two installers and prepare preview notes
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for arch in arm64 x64; do
            test -s "release-artifacts/Companio-$arch/Companio-Setup-$version-$arch.exe"
          done
          count="$(find release-artifacts -type f -name 'Companio-Setup-*.exe' | wc -l | tr -d ' ')"
          test "$count" = "2"
          {
            echo "# Companio v$version — Windows preview"
            echo
            echo "Unsigned pre-release for Windows 11. This build passed unit tests, packaged x64 verification and native Windows ARM64 smoke testing."
            echo "Choose **ARM64** for Snapdragon-based Windows laptops, or **x64** for Intel/AMD."
            echo "Downloads below are direct files; a GitHub account is not required."
            echo "Optional offline Whisper setup is user-initiated in Voice Settings and verifies upstream SHA-256 before installing."
            echo "Code signing and real-device speech accuracy benchmarking are not yet complete. Windows may show a publisher warning."
            echo
            echo "## SHA-256 checksums"
            echo
            echo '```text'
            for arch in arm64 x64; do
              sha256sum "release-artifacts/Companio-$arch/Companio-Setup-$version-$arch.exe" | sed 's|release-artifacts/Companio-[^/]*/||'
            done
            echo '```'
          } > RELEASE_NOTES.md
      - name: Publish clean prerelease with ARM64 and x64 only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.metadata.outputs.version }}
          name: Companio Preview v${{ steps.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-artifacts/Companio-arm64/Companio-Setup-*.exe
            release-artifacts/Companio-x64/Companio-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
