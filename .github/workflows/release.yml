name: Release Companio Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installers (${{ matrix.target.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - arch: x64
            flag: --x64
          - arch: arm64
            flag: --arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Installer & Portable Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win ${{ matrix.target.flag }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: companio-windows-${{ matrix.target.arch }}
          path: release/*.exe

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release with Installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.exe
          name: Companio Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
