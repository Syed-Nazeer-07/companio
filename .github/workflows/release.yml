name: Release Companio Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build Windows Installers (${{ matrix.target.arch }})
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    strategy:
      matrix:
        target:
          - arch: x64
            flag: --x64
          - arch: arm64
            flag: --arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Electron Builder download cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.electron-builder-cache
          key: companio-electron-builder-${{ runner.os }}-v26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            companio-electron-builder-${{ runner.os }}-v26-
      - name: Install Dependencies
        run: npm ci

      - name: Verify tagged release matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$appVersion") {
            throw "Tag $env:RELEASE_TAG does not match package version v$appVersion."
          }

      - name: Native security regression checks
        run: npm run test:unit
      - name: Build Web Application
        run: npm run build
      - name: Regenerate multi-resolution Windows icons
        shell: pwsh
        run: ./scripts/generate-icon.ps1
      - name: Verify no high-severity advisories
        run: npm audit --audit-level=high

      - name: Include verified offline voice runtime and model
        shell: pwsh
        run: node scripts/prepare-bundled-voice.cjs ${{ matrix.target.arch }}

      - name: Package the Windows installer (no portable duplicates)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win nsis ${{ matrix.target.flag }} --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Warning "Installer packaging failed (attempt $attempt). Retrying."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          exit 1

      - name: Smoke test packaged x64 desktop startup and IPC
        if: matrix.target.arch == 'x64'
        run: npm run test:desktop-smoke

      - name: Generate SHA-256 release checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content "release/SHA256SUMS-${{ matrix.target.arch }}.txt"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: companio-windows-${{ matrix.target.arch }}
          path: |
            release/Companio-Setup-*.exe
            release/SHA256SUMS-${{ matrix.target.arch }}.txt
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Verify both installer files and prepare checksummed preview notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for arch in x64 arm64; do
            dir="release-artifacts/companio-windows-$arch"
            filename="Companio-Setup-$version-$arch.exe"
            test -s "$dir/$filename"
            (cd "$dir" && sha256sum -c "SHA256SUMS-$arch.txt")
          done
          count="$(find release-artifacts -name 'Companio-Setup-*.exe' -type f | wc -l | tr -d ' ')"
          test "$count" = "2"
          {
            printf '# Companio %s — Windows preview\n\n' "$GITHUB_REF_NAME"
            echo 'Unsigned preview build for Windows 11, not a signed production installer.'
            echo 'Choose **arm64** for Snapdragon/Windows on ARM and **x64** for Intel or AMD.'
            echo 'No account is required to download the installer from this release.'
            echo 'Bundled offline voice runs only when the user activates the microphone. Basic commands work without Ollama or an API key.'
            echo 'Windows SmartScreen may warn because these installers are not code-signed.'
            printf '\n## SHA-256 installer checksums\n\n```text\n'
            for arch in arm64 x64; do
              cat "release-artifacts/companio-windows-$arch/SHA256SUMS-$arch.txt"
            done
            printf '```\n'
          } > RELEASE_NOTES.md

      - name: Publish exactly two architecture installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/Companio-Setup-*.exe
          name: Companio Preview ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
