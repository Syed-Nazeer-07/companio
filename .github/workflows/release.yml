name: Release Companio Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build Windows Installers (${{ matrix.target.arch }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      matrix:
        target:
          - arch: x64
            flag: --x64
          - arch: arm64
            flag: --arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify tagged release matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$appVersion") {
            throw "Tag $env:RELEASE_TAG does not match package version v$appVersion."
          }

      - name: Native security regression checks
        run: npm run test:unit
      - name: Build Web Application
        run: npm run build
      - name: Verify no high-severity advisories
        run: npm audit --audit-level=high

      - name: Package the Windows installer (no portable duplicates)
        run: npx electron-builder --win nsis ${{ matrix.target.flag }} --publish never

      - name: Smoke test packaged x64 desktop startup and IPC
        if: matrix.target.arch == 'x64'
        run: npm run test:desktop-smoke

      - name: Generate SHA-256 release checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content "release/SHA256SUMS-${{ matrix.target.arch }}.txt"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: companio-windows-${{ matrix.target.arch }}
          path: |
            release/Companio-Setup-*.exe
            release/SHA256SUMS-${{ matrix.target.arch }}.txt
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release with Installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/Companio-Setup-*.exe
            release-artifacts/**/SHA256SUMS-*.txt
          name: Companio Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
